# Static site: no build step, files are served directly from public/
[build]
  publish = "public"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/free/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[redirects]]
  from = "/refund"
  to = "/#refund"
  status = 301

[[redirects]]
  from = "/faq"
  to = "/#faq"
  status = 301
